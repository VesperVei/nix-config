# ==========================
# Inner tmux profile for pwn
# ==========================

# Keep the inner tmux reachable when the outer tmux uses C-a.
set -g prefix C-b
unbind C-a
bind-key C-b send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc"
set -s set-clipboard on

set -g mouse on
set-window-option -g mode-keys vi
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# PWN status state. scripts/update_mode.sh refreshes mode and GDB fields.
set -g @attack 0
set -g @mode_name "PWN"
set -g @mode_bg "#7aa2f7"
set -g @mode_fg "#1a1b26"
set -g @gdb_state "GDB idle"
set -g @gdb_bg "#414868"
set -g @gdb_fg "#c0caf5"
set -g @gdb_count "0"

# Minimal top status for the embedded pwn tmux.
set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 2
set -g status-style "bg=#11121d,fg=#a9b1d6"
set -g status-left-length 16
set -g status-right-length 0
set -g status-left '#(sh ~/.config/tmux/scripts/update_mode.sh >/dev/null 2>&1)#[fg=#{@mode_fg},bg=#{@mode_bg},bold] #{@mode_name} #[default]'
set -g status-right ''

set -g window-status-separator ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#{@mode_bg}"
set -g message-style "fg=#c0caf5,bg=#1f2335"
set -g mode-style "fg=#1a1b26,bg=#7dcfff"

# Prefix + a refreshes and reports the auto-detected mode.
bind-key a run-shell "sh ~/.config/tmux/scripts/update_mode.sh" \; display-message "#{@mode_name} / #{@gdb_state}"
bind-key r source-file ~/.config/tmux/tmux.conf \; run-shell "sh ~/.config/tmux/scripts/update_mode.sh" \; display-message "inner tmux reloaded"
bind-key g run-shell "sh ~/.config/tmux/scripts/update_mode.sh" \; display-message "#{@gdb_state}"

# Prefix + G opens a debugger pane in the current path.
bind-key G split-window -h -c "#{pane_current_path}" "gdb -q" \; run-shell "sh ~/.config/tmux/scripts/update_mode.sh"

# Splits and pane movement stay simple inside the SSH target.
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# Copy mode and OSC 52 clipboard forwarding through SSH/outer terminal.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "base64 | tr -d '\n' | awk '{printf \"\\033]52;c;%s\\a\", \$0}' > #{pane_tty}"
